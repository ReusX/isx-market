<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Blue rounded background -->
  <rect width="512" height="512" rx="108" fill="#5B6CF9"/>
  <!-- White price line: horizontal then 90deg bend downward -->
  <path d="M 79 187 H 305" stroke="white" stroke-width="54" stroke-linecap="round" fill="none"/>
  <path d="M 305 187 Q 359 187 359 241 V 335" stroke="white" stroke-width="54" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Candlestick top wick (white) -->
  <line x1="305" y1="300" x2="305" y2="333" stroke="white" stroke-width="17" stroke-linecap="round"/>
  <!-- Green candle body -->
  <rect x="263" y="333" width="84" height="85" rx="10" fill="#22C55E"/>
  <!-- Bottom wick (white) -->
  <line x1="305" y1="418" x2="305" y2="453" stroke="white" stroke-width="17" stroke-linecap="round"/>
</svg>
