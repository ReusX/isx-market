<svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Banknote body: dark navy like 250 IQD note -->
  <rect width="32" height="32" rx="7" fill="#152347"/>

  <!-- Outer security border -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="5.5" stroke="#1E3572" stroke-width="0.6"/>

  <!-- Inner border with dash pattern (security printing feel) -->
  <rect x="3" y="3" width="26" height="26" rx="4" stroke="#2A4D90" stroke-width="0.4" stroke-dasharray="1.5 0.8"/>

  <!-- Left guilloche circle ornament -->
  <circle cx="8" cy="16" r="3.5" stroke="#1E3D80" stroke-width="0.7" fill="none"/>
  <circle cx="8" cy="16" r="1.8" stroke="#264E9A" stroke-width="0.4" fill="none"/>
  <circle cx="8" cy="16" r="0.5" fill="#2A5298"/>

  <!-- Right guilloche circle ornament -->
  <circle cx="24" cy="16" r="3.5" stroke="#1E3D80" stroke-width="0.7" fill="none"/>
  <circle cx="24" cy="16" r="1.8" stroke="#264E9A" stroke-width="0.4" fill="none"/>
  <circle cx="24" cy="16" r="0.5" fill="#2A5298"/>

  <!-- Horizontal thin lines (banknote background lines) -->
  <line x1="3" y1="9"  x2="29" y2="9"  stroke="#1E3572" stroke-width="0.3"/>
  <line x1="3" y1="23" x2="29" y2="23" stroke="#1E3572" stroke-width="0.3"/>

  <!-- Gold Arabic "د.ع" (IQD abbreviation) centered -->
  <text x="16" y="20.5" text-anchor="middle"
        font-family="serif" font-size="10.5" font-weight="700"
        fill="#F5C84B" letter-spacing="0.5">د.ع</text>

  <!-- Gold corner stars / dots -->
  <circle cx="5.5" cy="5.5"  r="0.8" fill="#F5C84B" opacity="0.6"/>
  <circle cx="26.5" cy="5.5" r="0.8" fill="#F5C84B" opacity="0.6"/>
  <circle cx="5.5" cy="26.5" r="0.8" fill="#F5C84B" opacity="0.6"/>
  <circle cx="26.5" cy="26.5" r="0.8" fill="#F5C84B" opacity="0.6"/>
</svg>
