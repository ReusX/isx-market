name: News Pipeline

# Scrapes ISX/Iraq finance news from RS.iq, Alsumaria, and ISC →
# rewrites in Arabic with Claude Haiku → posts to WordPress automatically.

on:
  schedule:
    # Every 30 minutes, 7am-11pm Baghdad time (UTC+3 = 04:00-20:00 UTC)
    - cron: '*/30 4-20 * * *'
  workflow_dispatch:
    inputs:
      source:
        description: 'Source to run (all / rs / alsumaria / isc)'
        default: 'all'
      dry_run:
        description: 'Dry run (true = rewrite only, no WP post)'
        default: 'false'

concurrency:
  group: news-pipeline
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt -q

      - name: Run news pipeline
        env:
          ANTHROPIC_API_KEY:       ${{ secrets.ANTHROPIC_API_KEY }}
          WP_URL:                  ${{ secrets.WP_URL }}
          WP_USERNAME:             ${{ secrets.WP_USERNAME }}
          WP_APP_PASSWORD:         ${{ secrets.WP_APP_PASSWORD }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SOURCE="${{ github.event.inputs.source || 'all' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          ARGS="--source $SOURCE --limit 8"
          [ "$DRY" = "true" ] && ARGS="$ARGS --dry-run"
          python3 scripts/news_pipeline.py $ARGS
