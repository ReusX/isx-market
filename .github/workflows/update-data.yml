name: Update Live Market Data

on:
  schedule:
    # Every hour 07:00–15:00 UTC (= 10:00–18:00 Baghdad) — covers full ISX trading day + post-close
    - cron: '0 7-15 * * 0-4'   # Sun–Thu (ISX trading days)
    # Every 3 hours overnight / weekends to keep RSISX fresh
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fetch live data
        run: |
          pip install requests openpyxl -q
          python3 fetch_live.py

      - name: Commit
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/live.json data/hist.json data/ohlcv.json
          git diff --cached --quiet && echo "No changes" || (git commit -m "chore: live data update [skip ci]" && git push)
