name: Daily Price Update

on:
  schedule:
    # 11:30 UTC = 2:30pm Baghdad (UTC+3) — 30 min after ISX close, Sun–Thu
    - cron: '30 11 * * 0-4'
  workflow_dispatch:  # allow manual run from GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt -q

      - name: Fetch today's session workbook from ISX and push to Supabase
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd scripts
          # --days 5 catches Mon after a Thu close + any missed days
          python3 run_pipeline.py --mode daily --days 5
