name: News feed

# Headlines from Iraq's economy sources into `news_feed`, every 30 minutes
# through the trading day and hourly overnight. No AI, no bodies, no cost:
# scripts/news_feed.py reads each source's own list and writes the new URLs.
on:
  schedule:
    - cron: '*/30 4-18 * * *'
    - cron: '0 19-23,0-3 * * *'
  workflow_dispatch:

concurrency:
  group: news-feed
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Ingest
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/news_feed.py
