name: FX Record

# Appends USD/IQD observations to `fx_observations`.
#
# Every dollar rate this site displayed before 31 August 2026 was written into
# a single row of `rates_cache` and destroyed by the next fetch. The official
# rate is backfillable from the Central Bank's own workbooks; the parallel
# market is not. This job is where that history now comes from, so a gap in its
# schedule is a gap in the record that cannot be filled in later.
#
# Running it often is safe. Every write goes through the database's
# `dedupe_key`, so re-reading an unchanged article inserts nothing and polling
# the CBI table collapses to one row a day. The cadence is chosen for how
# quickly a change should show up, not for how much history it produces.

on:
  # TEMPORARY — proves this workflow in the real Actions environment before the
  # branch is merged. `workflow_dispatch` only registers from the default
  # branch, so a branch-scoped push trigger is the only way to exercise it
  # pre-merge. Removed once verified.
  push:
    branches: [feat/fx-observation-spine]
  schedule:
    # 08:00, 11:00, 14:00, 17:00 and 20:00 Baghdad (UTC+3, no DST) — through
    # the trading day, with a close-of-day reading after the exchanges settle.
    - cron: '0 5,8,11,14,17 * * *'
  workflow_dispatch:

concurrency:
  group: fx-record
  cancel-in-progress: false   # never cancel a write; let a slow run finish

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Record observations
        env:
          # Two, not three. The anon key is only used by the READ layer
          # (lib/fxHistory.ts, lib/freshness.ts) and by `createClient()`, which
          # needs a Next request context this job does not have. The ingester
          # writes through `createAdminClient()`, which reads the URL and the
          # service-role key and nothing else. Verified by running the job with
          # the anon key unset.
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/fx-record.ts

      # TEMPORARY — proves insert / skip / correction / error against the real
      # database from inside Actions. Removed with the push trigger above.
      - name: Verify write path
        env:
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/fx-verify.ts
